name: Release

# Publishes herdr-woof to npm when the operator pushes a v* tag. npm trusted
# publishing (OIDC): no token or secret is used. The npmjs.com trusted-publisher
# setting names this file, so it must stay release.yml. Add required reviewers
# to the `npm` environment in the repository settings to gate the publish job.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.2"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
      - run: bun install --frozen-lockfile
      - run: bun run release:preflight --only versions,changelog --tag "$GITHUB_REF_NAME"
      - run: bun run verify

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22.18.0 ships an older npm.
      - run: npm install -g npm@11.19.1
      - run: bun install --frozen-lockfile
      # prepublishOnly builds dist/ before the tarball is packed.
      - run: npm publish --provenance --access public
