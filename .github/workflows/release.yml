name: Release

# Releases are cut by pushing a `v<major>.<minor>.<patch>` tag on master after
# `bun run release:prepare` and `bun run release:dry-run`. Merging a PR never
# releases on its own.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.2"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on master
        run: |
          git fetch --no-tags --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun run --silent scripts/print-version.ts)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi
          echo "releasing v$pkg"

      - run: bun run verify

      - name: Pack artifact
        run: bun pm pack --destination ./artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: sheepherdr-tarball
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*.tgz
