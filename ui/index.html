<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../assets/brand/woof.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Woof runs</title>
    <script>
      // Set the theme before first paint so a light-theme reload does not flash dark.
      // Dark is the default; the toggle stores the choice under this key.
      try {
        var stored = localStorage.getItem("woof.theme");
        document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
