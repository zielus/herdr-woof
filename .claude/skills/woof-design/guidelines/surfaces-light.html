<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--bg-surface)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:80px}.sw i{display:block;height:56px;border-radius:5px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--type-mono-sm);color:var(--text-primary);margin-top:6px;font-weight:500}.sw span{display:block;font:var(--type-mono-sm);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--bg-app)"></i><b>app</b><span>--bg-app</span></div><div class="sw"><i style="background:var(--bg-surface)"></i><b>surface</b><span>--bg-surface</span></div><div class="sw"><i style="background:var(--bg-raised)"></i><b>raised</b><span>--bg-raised</span></div><div class="sw"><i style="background:var(--bg-inset)"></i><b>inset</b><span>--bg-inset</span></div><div class="sw"><i style="background:var(--bg-hover)"></i><b>hover</b><span>--bg-hover</span></div><div class="sw"><i style="background:var(--bg-active)"></i><b>active</b><span>--bg-active</span></div></div></body></html>
