<!-- @dsCard group="Colors" viewport="700x120" name="State colors (dark)" subtitle="Color carries state and nothing else" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--bg-surface)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:80px}.sw i{display:block;height:56px;border-radius:5px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--type-mono-sm);color:var(--text-primary);margin-top:6px;font-weight:500}.sw span{display:block;font:var(--type-mono-sm);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--state-pass)"></i><b>pass</b><span>completed · accepted</span></div><div class="sw"><i style="background:var(--state-fail)"></i><b>fail</b><span>failed · rejected · corrupt</span></div><div class="sw"><i style="background:var(--state-blocked)"></i><b>blocked</b><span>needs the operator</span></div><div class="sw"><i style="background:var(--state-lost)"></i><b>lost</b><span>exited · idle · abandoned</span></div><div class="sw"><i style="background:var(--state-working)"></i><b>working</b><span>running · alive</span></div></div></body></html>
