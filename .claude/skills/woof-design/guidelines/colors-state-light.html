<!-- @dsCard group="Colors" viewport="700x120" name="State colors (light)" subtitle="Darker steps of the same hues for 4.5:1 on white" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--bg-surface)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:80px}.sw i{display:block;height:56px;border-radius:5px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--type-mono-sm);color:var(--text-primary);margin-top:6px;font-weight:500}.sw span{display:block;font:var(--type-mono-sm);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--state-pass)"></i><b>pass</b><span>teal-5</span></div><div class="sw"><i style="background:var(--state-fail)"></i><b>fail</b><span>rose-5</span></div><div class="sw"><i style="background:var(--state-blocked)"></i><b>blocked</b><span>amber-5</span></div><div class="sw"><i style="background:var(--state-lost)"></i><b>lost</b><span>grey</span></div><div class="sw"><i style="background:var(--state-working)"></i><b>working</b><span>lavender-5</span></div></div></body></html>
