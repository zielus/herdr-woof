<!-- @dsCard group="Spacing" viewport="700x160" name="Density in use" subtitle="28px rows, 12px panel padding, 1px separators" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--bg-surface)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:80px}.sw i{display:block;height:56px;border-radius:5px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--type-mono-sm);color:var(--text-primary);margin-top:6px;font-weight:500}.sw span{display:block;font:var(--type-mono-sm);color:var(--text-muted)}</style></head><body><div style="border:1px solid var(--border-default);border-radius:5px;overflow:hidden;max-width:560px"><div style="padding:6px 12px;font:var(--type-label);letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border-subtle)">Stages</div><div style="display:grid;grid-template-columns:100px 1fr 90px;height:28px;align-items:center;padding:0 12px;font:var(--type-mono-sm);border-bottom:1px solid var(--border-subtle)"><span>plan</span><span style="color:var(--text-muted)">v1 a1</span><span style="color:var(--state-pass)">accepted</span></div><div style="display:grid;grid-template-columns:100px 1fr 90px;height:28px;align-items:center;padding:0 12px;font:var(--type-mono-sm);border-bottom:1px solid var(--border-subtle)"><span>build</span><span style="color:var(--text-muted)">v2 a1</span><span style="color:var(--state-pass)">accepted</span></div><div style="display:grid;grid-template-columns:100px 1fr 90px;height:28px;align-items:center;padding:0 12px;font:var(--type-mono-sm);border-bottom:1px solid var(--border-subtle)"><span>review</span><span style="color:var(--text-muted)">v2 a1</span><span style="color:var(--state-working)">open</span></div></div></body></html>
