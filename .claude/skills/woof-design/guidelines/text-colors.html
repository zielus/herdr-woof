<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--bg-surface)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:80px}.sw i{display:block;height:56px;border-radius:5px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--type-mono-sm);color:var(--text-primary);margin-top:6px;font-weight:500}.sw span{display:block;font:var(--type-mono-sm);color:var(--text-muted)}</style></head><body><div class="row" style="align-items:flex-start"><div style="flex:1;display:grid;gap:6px;font:var(--type-body)"><div style="color:var(--text-primary)">--text-primary — Run br-4f2a completed.</div><div style="color:var(--text-secondary)">--text-secondary — 3 of 3 rounds used.</div><div style="color:var(--text-muted)">--text-muted — updated 12 s ago</div><div style="color:var(--text-faint)">--text-faint — placeholder</div><div style="color:var(--accent-text)">--accent-text — docs/workflows/authoring.md</div></div><div style="flex:1;display:grid;gap:8px"><div style="height:28px;border:1px solid var(--border-subtle);border-radius:5px;padding:0 10px;font:var(--type-mono-sm);line-height:26px;color:var(--text-muted)">--border-subtle</div><div style="height:28px;border:1px solid var(--border-default);border-radius:5px;padding:0 10px;font:var(--type-mono-sm);line-height:26px;color:var(--text-muted)">--border-default</div><div style="height:28px;border:1px solid var(--border-strong);border-radius:5px;padding:0 10px;font:var(--type-mono-sm);line-height:26px;color:var(--text-muted)">--border-strong</div></div></div></body></html>
