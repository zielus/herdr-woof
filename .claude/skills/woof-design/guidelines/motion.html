<!-- @dsCard group="Spacing" viewport="700x110" name="Motion & focus" subtitle="80ms color, 140ms ease-out panels, 1.2s pulse for live dots, focus ring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--bg-surface)}.row{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1 1 0;min-width:80px}.sw i{display:block;height:56px;border-radius:5px;border:1px solid var(--border-subtle)}.sw b{display:block;font:var(--type-mono-sm);color:var(--text-primary);margin-top:6px;font-weight:500}.sw span{display:block;font:var(--type-mono-sm);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:24px;align-items:center;font:var(--type-mono-sm);color:var(--text-muted)"><span style="display:inline-flex;align-items:center;gap:8px"><i style="width:6px;height:6px;border-radius:50%;background:var(--state-working);animation:p 1.2s infinite"></i>working · pulse 1.2s</span><span style="height:28px;padding:0 12px;border-radius:5px;border:1px solid var(--border-default);box-shadow:var(--focus-ring);display:inline-flex;align-items:center;color:var(--text-primary)">focus ring</span><span>--duration-fast 80ms · --duration-base 140ms</span></div><style>@keyframes p{50%{opacity:.25}}</style></body></html>
