.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);

}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;

  height: 16px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {

  outline-offset: 2px;
}

  .form-control-color[type="color"] {

    left: 50%;

    height: 44px;

  }

}

svg {

}

}

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        grid-template-columns: 2ch 11ch minmax(17ch, 1fr) 8ch 7ch;
      }
      #woof-native .workflow {
        display: none;
      }
    }
    @media (max-width: 520px) {
      #woof-native .step {
        grid-template-columns: 2ch 2ch minmax(8ch, 1fr) 6ch;
      }
      #woof-native .step-owner {
        grid-column: 3;
        grid-row: 2;
      }
      #woof-native .step-status {
        grid-column: 3 / -1;
        grid-row: 3;
      }
      #woof-native .step-time {
        grid-column: 4;
        grid-row: 1;
      }
      #woof-native .feed {
        grid-template-columns: 8ch 1ch minmax(0, 1fr);
        gap: 0 1ch;
      }
      #woof-native .feed .stage {
        display: none;
      }
      #woof-native .feed .msg {
        grid-column: 3;
      }
      #woof-native .runrow {
        grid-template-columns: 2ch minmax(0, 1fr) 7ch;
      }
      #woof-native .runname {
        grid-column: 2;
        grid-row: 1;
      }
      #woof-native .runstatus {
        grid-column: 2;
        grid-row: 2;
      }
      #woof-native .runstage {
        display: none;
      }
      #woof-native .runtime {
        grid-column: 3;
        grid-row: 1;
      }
      #woof-native .indent {
        padding-left: 2ch;
      }
      #woof-native .screen {
        min-height: 0;
      }
      #woof-native .agentrow {
        grid-template-columns: 10ch 8ch minmax(0, 1fr);
        gap: 0 1ch;

      #woof-native .agentstage {

      #woof-native .kv {

      #woof-native .end {

      }

    @media (pointer: coarse) {
      #woof-native button {
        min-height: 44px;
      }
    }
  &lt;/style&gt;
  &lt;div id="wn-top"&gt;&lt;/div&gt;
  &lt;div class="rule"&gt;&lt;/div&gt;
  &lt;div id="wn-tabs" class="tabs"&gt;&lt;/div&gt;
  &lt;div class="rule"&gt;&lt;/div&gt;
  &lt;div id="wn-body" class="screen"&gt;&lt;/div&gt;
  &lt;div class="rule"&gt;&lt;/div&gt;
  &lt;div id="wn-footer" class="foot"&gt;&lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById("woof-native");
      const s = {
        screen: "run",
        tab: "steps",
        expanded: "review",
        cursor: 2,
        node: "step",
        run: 0,
        file: null,
        color: true,
      };
      const rows = [
        {
          id: "build",
          title: "build",
          mark: "✓",
          who: "builder",
          status: "accepted",
          tone: "green",
          time: "18s",
          file: "completion.md",
          lines: [
            "attempt 1   dispatched 09:12:54 → accepted 09:13:12",
            "gate        passed → verify",
          ],
        },
        {
          id: "verify",
          title: "verify",
          mark: "✓",
          who: "check",
          status: "passed",
          tone: "green",
          time: "&lt;1s",
          file: "output.log",
          lines: ["command     bun test", "result      exit 0 → review"],
        },
        {
          id: "review",
          title: "review",
          mark: "↻",
          who: "reviewer",
          status: "changes requested",
          tone: "amber",
          time: "21s",
          file: "review.md",
          lines: [
            "attempt 1   dispatched 09:13:20 → accepted 09:13:41",
            "verdict     fail",
            "gate        changes requested → repair",
            "handoff     accepted review → builder (same agent)",
          ],
        },
        {
          id: "repair",
          title: "repair",
          mark: "●",
          who: "builder",
          status: "awaiting result",
          tone: "cyan",
          time: "42s",
          file: null,
          lines: [
            "attempt 1   dispatched 09:13:45 · same builder",
            "input       accepted review from review / visit 1",
            "waiting     no accepted result yet",
          ],
        },
        {
          id: "verify2",
          title: "verify",
          mark: "·",
          who: "check",
          status: "pending repair",
          tone: "dim",
          time: "—",
          file: null,
          lines: ["conditional on the repair gate passing", "no check has started"],
        },
        {
          id: "review2",
          title: "review 2",
          mark: "·",
          who: "reviewer",
          status: "pending checks",
          tone: "dim",
          time: "—",
          file: null,
          lines: ["conditional on repaired work passing verification", "no attempt has started"],
        },
      ];
      const runlist = [
        ["Fix empty-state rendering", "build-review", "running", "repair", "1m 40s", "cyan"],
        ["Add retry backoff", "plan-build-review", "blocked", "build", "5m 55s", "amber"],
        ["Normalize run summaries", "build-review", "completed", "review 2", "1m 27s", "green"],
        ["Document role overrides", "build-review", "host lost", "build", "unknown", "red"],
      ];
      const feed = [
        ["09:12:47", "·", "run", "", "Started", "dim"],
        ["09:12:52", "+", "builder", "", "Agent started · claude / sonnet", "cyan"],
        ["09:12:54", "→", "builder", "build", "Task dispatched", "cyan"],
        ["09:13:12", "✓", "builder", "build", "Completion report accepted", "green"],
        ["09:13:13", "✓", "gate", "verify", "Checks passed → review", "green"],
        ["09:13:18", "+", "reviewer", "", "Agent started · claude / sonnet", "cyan"],
        ["09:13:20", "→", "reviewer", "review", "Task dispatched", "cyan"],
        ["09:13:41", "↓", "reviewer", "review", "Review received · changes requested", "dim"],
        ["09:13:42", "↻", "gate", "review", "Changes requested → repair", "amber"],
        ["09:13:45", "→", "builder", "repair", "Task dispatched · same agent", "cyan"],
      ];
      const esc = (x) =&gt;
        String(x ?? "").replace(
          /[&amp;&lt;&gt;"&#x27;]/g,
          (c) =&gt;
            ({
              "&amp;": "&amp;amp;",
              "&lt;": "&amp;lt;",
              "&gt;": "&amp;gt;",
              &#x27;"&#x27;: "&amp;quot;",
              "&#x27;": "&amp;#39;",
            })[c],
        );
      function save() {
        window.openai
          ?.setWidgetState?.({
            modelContent: {
              design: "terminal-native",
              screen: s.screen,
              tab: s.tab,
              expanded: s.expanded,
              file: s.file,
            },
            privateContent: { ...s },
          })
          .catch(() =&gt; {});
      }
      function update(fn, focus) {
        fn();
        render();
        save();
        if (focus)
          root
            .querySelector(typeof focus === "function" ? focus() : focus)
            ?.focus({ preventScroll: true });
      }
      const tabs = ["steps", "activity", "config"];
      const selected = () =&gt; `[data-${s.node}="${work()[s.cursor].id}"]`;
      function openRun(index) {
        update(() =&gt; {
          s.run = index;
          s.screen = "run";
          s.tab = "steps";
          s.file = null;
          s.expanded = null;
          s.cursor = 0;
          s.node = "step";
        }, selected);
      }
      function closeFile() {
        update(() =&gt; {
          s.file = null;
        }, selected);
      }
      function openFile(id) {
        update(() =&gt; {
          s.file = id;
        }, &#x27;[data-action="close"]&#x27;);
      }
      function visibleNodes() {
        return work().flatMap((r, cursor) =&gt; [
          { cursor, node: "step" },
          ...(s.expanded === r.id &amp;&amp; r.file ? [{ cursor, node: "file" }] : []),
        ]);
      }
      function work() {
        if (s.run === 0) return rows;
        if (s.run === 2)
          return rows.map((r, i) =&gt; ({
            ...r,
            status: i === 2 ? "changes requested" : i === 5 ? "approved" : "passed",
            tone: i === 2 ? "amber" : "green",
            mark: i === 2 ? "↻" : "✓",
            time: i === 3 ? "11s" : i === 4 ? "&lt;1s" : i === 5 ? "13s" : r.time,
            file:
              i === 3 ? "completion.md" : i === 4 ? "output.log" : i === 5 ? "review.md" : r.file,
            lines:
              i &gt;= 3
                ? [
                    "attempt 1   recorded result accepted",
                    "gate        " + (i === 5 ? "approved → completed" : "passed"),
                  ]
                : r.lines,
          }));
        if (s.run === 1)
          return [
            {
              ...rows[0],
              id: "plan",
              title: "plan",
              who: "planner",
              status: "accepted",
              file: null,
              lines: ["plan accepted → builder"],
            },
            {
              ...rows[0],
              status: "permission required",
              tone: "amber",
              mark: "!",
              file: null,
              lines: [
                "attempt 1   dispatched",
                "action      answer the permission prompt in builder’s tab",
              ],
            },
          ];
        return [
          {
            ...rows[0],
            status: "outcome unknown",
            tone: "red",
            mark: "?",
            file: null,
            lines: [
              "last action   build request dispatched",
              "host          lost · no terminal outcome recorded",
            ],
          },
        ];
      }
      function steps() {
        return `&lt;div class="step dim"&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;STEP&lt;/span&gt;&lt;span class="step-owner"&gt;OWNER&lt;/span&gt;&lt;span class="step-status"&gt;STATE&lt;/span&gt;&lt;span class="step-time right"&gt;TIME&lt;/span&gt;&lt;span class="step-output"&gt;OUTPUT&lt;/span&gt;&lt;/div&gt;${work()
          .map(
            (r, i) =&gt;
              `&lt;button class="step cursor-interaction" data-step="${r.id}" aria-current="${s.cursor === i &amp;&amp; s.node === "step"}" aria-expanded="${s.expanded === r.id}"&gt;&lt;span class="cursor"&gt;${s.cursor === i &amp;&amp; s.node === "step" ? "›" : " "}&lt;/span&gt;&lt;span class="dim"&gt;${s.expanded === r.id ? "▾" : "▸"}&lt;/span&gt;&lt;span class="step-name"&gt;&lt;span class="${r.tone}"&gt;${r.mark}&lt;/span&gt; ${r.title}&lt;/span&gt;&lt;span class="step-owner dim"&gt;${r.who}&lt;/span&gt;&lt;span class="step-status ${r.tone}"&gt;${r.status}&lt;/span&gt;&lt;span class="step-time right dim"&gt;${r.time}&lt;/span&gt;&lt;span class="step-output dim"&gt;${r.file ? "1 artifact" : "—"}&lt;/span&gt;&lt;/button&gt;${s.expanded === r.id ? `&lt;div class="indent"&gt;${r.lines.map((t) =&gt; `&lt;div class="tree"&gt;│ ${esc(t)}&lt;/div&gt;`).join("")}&lt;div class="tree"&gt;└ ${r.file ? `artifact    &lt;button class="cursor-interaction" data-file="${r.id}" aria-current="${s.cursor === i &amp;&amp; s.node === "file"}"&gt;${r.file}&lt;/button&gt; &lt;span class="dim"&gt;[enter to read]&lt;/span&gt;` : "no accepted output"}&lt;/div&gt;&lt;/div&gt;` : ""}`,
          )
          .join(
            "",
          )}&lt;div class="spacer"&gt;&lt;/div&gt;&lt;div class="dim"&gt;${s.run === 0 ? "next: verify → review, if each gate passes" : s.run === 2 ? "result: completed · approved" : s.run === 1 ? "action: answer the permission prompt in builder’s tab" : "host lost · outcome unknown"}&lt;/div&gt;`;
      }
      function activity() {
        const events =
          s.run === 0
            ? feed
            : s.run === 2
              ? [
                  ["09:00:05", "↻", "gate", "review", "Changes requested → repair", "amber"],
                  ["09:00:08", "→", "builder", "repair", "Task dispatched · same agent", "cyan"],
                  ["09:00:19", "✓", "builder", "repair", "Completion report accepted", "green"],
                  ["09:00:20", "✓", "gate", "verify", "Checks passed → review", "green"],
                  ["09:00:23", "→", "reviewer", "review 2", "Task dispatched", "cyan"],
                  ["09:00:37", "✓", "gate", "review 2", "Approved → completed", "green"],
                  ["09:00:38", "✓", "run", "", "Completed · approved", "green"],
                ]
              : s.run === 1
                ? [
                    ["09:09:15", "✓", "planner", "plan", "Plan accepted", "green"],
                    ["09:09:22", "→", "builder", "build", "Task dispatched", "cyan"],
                    ["09:13:50", "!", "builder", "build", "Permission required", "amber"],
                  ]
                : [["08:41:11", "→", "builder", "build", "Task dispatched", "cyan"]];
        return (
          events
            .map(
              (e) =&gt;
                `&lt;div class="feed"&gt;&lt;span class="dim"&gt;${e[0]}&lt;/span&gt;&lt;span class="${e[5]}"&gt;${e[1]}&lt;/span&gt;&lt;span&gt;${e[2]}&lt;/span&gt;&lt;span class="stage dim"&gt;${e[3]}&lt;/span&gt;&lt;span class="msg ${e[5]}"&gt;${e[4]}&lt;/span&gt;&lt;/div&gt;`,
            )
            .join("") +
          `&lt;div class="spacer"&gt;&lt;/div&gt;&lt;div class="dim"&gt;${s.run === 0 ? "· waiting for builder / repair · 42s since dispatch" : s.run === 2 ? "✓ recorded outcome: completed" : s.run === 1 ? "! run blocked; answer in builder’s tab" : "! host lost; outcome unknown"}&lt;/div&gt;`
        );
      }
      function config() {
        return `&lt;div class="label"&gt;agents&lt;/div&gt;${s.run === 1 ? &#x27;&lt;div class="agentrow"&gt;&lt;span&gt;planner&lt;/span&gt;&lt;span&gt;claude&lt;/span&gt;&lt;span&gt;sonnet&lt;/span&gt;&lt;span class="agentstage"&gt;plan&lt;/span&gt;&lt;/div&gt;&#x27; : ""}&lt;div class="agentrow"&gt;&lt;span&gt;builder&lt;/span&gt;&lt;span&gt;claude&lt;/span&gt;&lt;span&gt;sonnet&lt;/span&gt;&lt;span class="agentstage"&gt;build, repair&lt;/span&gt;&lt;/div&gt;&lt;div class="agentrow"&gt;&lt;span&gt;reviewer&lt;/span&gt;&lt;span&gt;claude&lt;/span&gt;&lt;span&gt;sonnet&lt;/span&gt;&lt;span class="agentstage"&gt;review&lt;/span&gt;&lt;/div&gt;&lt;div class="spacer"&gt;&lt;/div&gt;&lt;div class="label"&gt;input · task preview&lt;/div&gt;&lt;pre&gt;${esc(JSON.stringify({ title: runlist[s.run][0], acceptanceCriteria: ["Requested behavior works.", "Existing behavior remains covered."] }, null, 2))}&lt;/pre&gt;&lt;div class="dim"&gt;full input: input.json&lt;/div&gt;&lt;div class="spacer"&gt;&lt;/div&gt;&lt;div class="label"&gt;context&lt;/div&gt;&lt;div class="kv"&gt;&lt;span class="dim"&gt;project&lt;/span&gt;&lt;span&gt;herdr-woof&lt;/span&gt;&lt;span class="dim"&gt;workflow&lt;/span&gt;&lt;span&gt;${runlist[s.run][1]}&lt;/span&gt;&lt;span class="dim"&gt;verify&lt;/span&gt;&lt;span&gt;bun test&lt;/span&gt;&lt;span class="dim"&gt;limits&lt;/span&gt;&lt;span&gt;3 review rounds · 2 attempts/visit · 2h timeout&lt;/span&gt;&lt;/div&gt;`;
      }
      function runs() {
        return `&lt;div class="runrow dim"&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;STATE&lt;/span&gt;&lt;span&gt;RUN&lt;/span&gt;&lt;span class="workflow"&gt;WORKFLOW&lt;/span&gt;&lt;span&gt;STEP&lt;/span&gt;&lt;span class="right"&gt;TIME&lt;/span&gt;&lt;/div&gt;${runlist.map((r, i) =&gt; `&lt;button class="runrow cursor-interaction" data-run="${i}" aria-current="${s.run === i}"&gt;&lt;span class="cyan"&gt;${s.run === i ? "›" : " "}&lt;/span&gt;&lt;span class="runstatus ${r[5]}"&gt;${r[2]}&lt;/span&gt;&lt;span class="runname"&gt;${r[0]}&lt;/span&gt;&lt;span class="workflow dim"&gt;${r[1]}&lt;/span&gt;&lt;span class="runstage dim"&gt;${r[3]}&lt;/span&gt;&lt;span class="runtime right dim"&gt;${r[4]}&lt;/span&gt;&lt;/button&gt;`).join("")}&lt;div class="spacer"&gt;&lt;/div&gt;&lt;div class="dim"&gt;herdr-woof · 1 running · 2 need attention · 1 completed&lt;/div&gt;`;
      }
      function fileView() {
        const r = work().find((x) =&gt; x.id === s.file);
        return `&lt;div class="dim"&gt;${r.file} · accepted ${r.id.startsWith("verify") ? "verification evidence" : r.title} / visit ${r.id.endsWith("2") ? 2 : 1} · SAMPLE CONTENT&lt;/div&gt;&lt;div class="rule"&gt;&lt;/div&gt;&lt;pre&gt;${s.file === "review2" ? "Verdict: pass\n\nThe repaired implementation meets the acceptance criteria.\nThe review gate approved the matching revision." : s.file === "review" ? "Verdict: fail\n\nEmpty-state rendering\n\nThe populated list still renders correctly.\nThe empty-list path needs an explicit empty-state component.\n\nRequested change\nHandle items.length === 0 before rendering the list.\nAdd a check for the empty-list case.\n\nThis accepted review is passed to the builder for repair." : s.file.startsWith("verify") ? "Command: bun test\nExit code: 0\n\nVerification passed." : "Build report\n\nImplementation submitted for verification and review."}&lt;/pre&gt;&lt;div class="spacer"&gt;&lt;/div&gt;&lt;div class="dim"&gt;(END)&lt;/div&gt;`;
      }
      function render() {
        root.dataset.color = String(s.color);
        root.querySelector("#wn-top").innerHTML =
          `&lt;div class="head"&gt;&lt;strong class="green"&gt;woof&lt;/strong&gt;&lt;span&gt;${s.screen === "runs" ? "runs / herdr-woof" : esc(runlist[s.run][0])}&lt;/span&gt;&lt;span class="end dim"&gt;SAMPLE&lt;/span&gt;&lt;/div&gt;${s.screen === "run" ? `&lt;div class="head"&gt;&lt;span class="dim"&gt;${runlist[s.run][1]}&lt;/span&gt;&lt;span class="${runlist[s.run][5]}"&gt;${runlist[s.run][2]} · ${runlist[s.run][3]}&lt;/span&gt;&lt;span class="dim"&gt;${runlist[s.run][4]}&lt;/span&gt;&lt;/div&gt;` : ""}`;
        root.querySelector("#wn-tabs").innerHTML =
          s.screen === "runs"
            ? "&lt;span&gt; runs &lt;/span&gt;"
            : s.file
              ? &#x27;&lt;span class="cyan"&gt; artifact pager &lt;/span&gt;&#x27;
              : ["steps", "activity", "config"]
                  .map(
                    (t, i) =&gt;
                      `&lt;button class="cursor-interaction" id="wn-tab-${t}" data-tab="${t}" role="tab" aria-controls="wn-body" aria-selected="${s.tab === t}"&gt; ${i + 1} ${t} &lt;/button&gt;`,
                  )
                  .join("");
        const hasTabs = s.screen === "run" &amp;&amp; !s.file;
        root.querySelector("#wn-tabs").setAttribute("role", hasTabs ? "tablist" : "group");
        root.querySelector("#wn-tabs").setAttribute("aria-label", "Run views");
        root.querySelector("#wn-body").setAttribute("role", hasTabs ? "tabpanel" : "region");
        if (hasTabs)
          root.querySelector("#wn-body").setAttribute("aria-labelledby", `wn-tab-${s.tab}`);
        else root.querySelector("#wn-body").removeAttribute("aria-labelledby");
        root.querySelector("#wn-body").innerHTML =
          s.screen === "runs"
            ? runs()
            : s.file
              ? fileView()
              : s.tab === "steps"
                ? steps()
                : s.tab === "activity"
                  ? activity()
                  : config();
        root.querySelector("#wn-footer").innerHTML = s.file
          ? &#x27;&lt;button class="cursor-interaction" data-action="close"&gt;&lt;kbd&gt;esc&lt;/kbd&gt; back to step&lt;/button&gt;&lt;span&gt;read-only&lt;/span&gt;&#x27;
          : `${s.screen === "runs" ? "&lt;span&gt;&lt;kbd&gt;↑↓&lt;/kbd&gt; move&lt;/span&gt;&lt;span&gt;&lt;kbd&gt;→ / enter&lt;/kbd&gt; open&lt;/span&gt;" : `${s.tab === "steps" ? "&lt;span&gt;&lt;kbd&gt;↑↓&lt;/kbd&gt; move&lt;/span&gt;&lt;span&gt;&lt;kbd&gt;→&lt;/kbd&gt; expand / enter&lt;/span&gt;&lt;span&gt;&lt;kbd&gt;←&lt;/kbd&gt; parent / collapse&lt;/span&gt;&lt;span&gt;&lt;kbd&gt;o&lt;/kbd&gt; read&lt;/span&gt;" : "&lt;span&gt;&lt;kbd&gt;←→&lt;/kbd&gt; switch tab&lt;/span&gt;"}&lt;span&gt;&lt;kbd&gt;1/2/3&lt;/kbd&gt; tab&lt;/span&gt;&lt;button class="cursor-interaction" data-action="back"&gt;&lt;kbd&gt;esc&lt;/kbd&gt; runs&lt;/button&gt;`}&lt;span class="end dim"&gt;${s.run === 0 ? "snapshot 09:14:27" : "sample history"}&lt;/span&gt;`;
      }
      root.addEventListener("click", (e) =&gt; {
        const d = e.target.closest("button")?.dataset;
        if (!d) return;
        if (d.run !== undefined) openRun(Number(d.run));
        else if (d.tab)
          update(() =&gt; {
            s.tab = d.tab;
            s.file = null;
          }, `[data-tab="${d.tab}"]`);
        else if (d.step)
          update(() =&gt; {
            s.expanded = s.expanded === d.step ? null : d.step;
            s.cursor = work().findIndex((r) =&gt; r.id === d.step);
            s.node = "step";
          }, selected);
        else if (d.file) {
          s.cursor = work().findIndex((r) =&gt; r.id === d.file);
          s.node = "file";
          openFile(d.file);
        } else if (d.action === "close") closeFile();
        else if (d.action === "back")
          update(() =&gt; {
            s.screen = "runs";
          }, `[data-run="${s.run}"]`);
      });
      root.addEventListener("keydown", (e) =&gt; {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const d = e.target.closest("button")?.dataset ?? {};
        // Native Tab focus and pointer focus establish the navigation cursor too.
        if (d.run !== undefined) s.run = Number(d.run);
        if (d.step || d.file) {
          s.cursor = work().findIndex((r) =&gt; r.id === (d.step || d.file));
          s.node = d.file ? "file" : "step";
        }
        const key = e.key;
        let used = true;
        if (key === "Escape") {
          if (s.file) closeFile();
          else
            update(() =&gt; {
              s.screen = "runs";
            }, `[data-run="${s.run}"]`);
        } else if (s.file) used = false;
        else if (s.screen === "run" &amp;&amp; ["1", "2", "3"].includes(key)) {
          const tab = tabs[Number(key) - 1];
          update(() =&gt; {
            s.tab = tab;
          }, `[data-tab="${tab}"]`);
        } else if (
          s.screen === "run" &amp;&amp;
          (d.tab || s.tab !== "steps") &amp;&amp;
          ["ArrowLeft", "ArrowRight"].includes(key)
        ) {
          const tab = tabs[(tabs.indexOf(s.tab) + (key === "ArrowRight" ? 1 : 2)) % 3];
          update(() =&gt; {
            s.tab = tab;
          }, `[data-tab="${tab}"]`);

      selectTab(tab);
      return;

      tab.closest(&#x27;[role="tablist"]&#x27;).querySelectorAll(&#x27;[role="tab"]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
