# Herdr plugin: actions run `bin/woof` from this checkout. Runs report their state
# as pane metadata from the run host; the actions resolve the project from the
# invocation context (HERDR_PLUGIN_CONTEXT_JSON).
id = "herdr-woof"
name = "Woof"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Start, inspect, watch and cancel Woof workflow runs; runs report state as pane metadata."
platforms = ["linux", "macos"]

[[build]]
command = ["bun", "install", "--frozen-lockfile"]

[[build]]
command = ["bun", "run", "build"]

[[actions]]
id = "doctor"
title = "Woof: doctor"
description = "Check Woof, Herdr, Claude Code, folder trust and configuration for the focused project."
command = ["bin/woof", "herdr", "doctor"]

[[actions]]
id = "status"
title = "Woof: run status"
description = "Show the active Woof runs of the focused project."
command = ["bin/woof", "herdr", "status"]

[[actions]]
id = "start"
title = "Woof: start from .woof/start.json"
description = "Start the project's default workflow with the input in .woof/start.json."
command = ["bin/woof", "herdr", "start"]

[[actions]]
id = "cancel"
title = "Woof: cancel the active run"
description = "Cancel the focused project's single active Woof run."
command = ["bin/woof", "herdr", "cancel"]

[[actions]]
id = "watch"
title = "Woof: watch the active run"
description = "Open a pane following the focused project's single active Woof run."
command = ["bin/woof", "herdr", "watch"]

# The pane the watch action opens: `woof watch --follow` from the plugin root, for the run
# directory the action passes as WOOF_RUN_DIR. Herdr closes a plugin pane when its command exits.
[[panes]]
id = "watch"
title = "Woof watch"
placement = "split"
command = ["bin/woof", "watch", "--follow"]
