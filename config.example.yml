# Copy to ~/.woof/config.yml, then choose the raw arguments for your installed CLI.
# Woof passes each argument literally; only ~/ and =~/ expand the home directory.
profiles:
  claude:
    agent: claude
    args: []
    description: General Claude Code worker
    tags: [general]
  codex:
    agent: codex
    args: []
    # Example raw preset: [--model, gpt-5.5, -c, model_reasoning_effort=high]
    description: Codex worker using its configured defaults
    tags: [coding, review]
  luna:
    agent: omp
    args: [--config, ~/.omp/agent/luna.yml]
    description: Custom OMP launch preset
    tags: [custom]
defaults:
  worker_profile: claude
